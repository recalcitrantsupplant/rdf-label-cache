name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot writes "Bump …" (sentence-case), which config-conventional
    # rejects. Check the PR author, not github.actor: a maintainer rerunning a
    # job changes the actor but must not make a Dependabot PR start failing.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ops/commitlint.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
