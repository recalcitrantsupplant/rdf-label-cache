name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot writes "Bump …" (sentence-case), which config-conventional
    # rejects; its commits are machine-generated, so skip linting them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/commitlint.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
