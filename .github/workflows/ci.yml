name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The vendor bot explicitly requests checks after pushing generated bundles.
  # GITHUB_TOKEN pushes do not start unattended pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot-commitlint:
    # Avoid publishing a second check named commitlint on ordinary PR events.
    name: ${{ github.event_name == 'workflow_dispatch' && 'commitlint' || 'dependabot-dispatch-guard' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Match commitlint.yml's Dependabot exemption, but verify the live PR
      # rather than trusting a branch prefix or an input supplied by the caller.
      - name: Verify this is the current head of an open Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" -f state=open)"
          jq --exit-status --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            'any(.[]; .user.login == "dependabot[bot]" and .head.sha == $sha and .head.repo.full_name == $repo)' <<< "$prs"

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # All logic lives in the script; the workflow only sets up the toolchain.
      - run: ./scripts/ops/ci.sh
