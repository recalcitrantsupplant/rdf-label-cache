name: seed

# Refresh the maintainer DEMO instance's public-vocabulary labels in R2. Manual
# (on demand): there's no automatic data drift to chase - releases deploy code,
# not data (scripts/deploy-demo.sh), so upstream vocab changes are picked up
# whenever this is run. Maintainer repo only - needs the demo's Cloudflare R2
# secrets, which forks lack. Forks self-serve via seed-labels.yml instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    if: github.repository_owner == 'recalcitrantsupplant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/seed.sh
        env:
          SEED_BASE: ${{ vars.SEED_BASE }}
          R2_BUCKET: ${{ vars.R2_BUCKET }} # e.g. label-cache-demo; seed.sh defaults to it if unset
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
