name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # release-please maintains a "release PR" from Conventional Commits; merging it
  # tags vX.Y.Z + cuts a GitHub Release. Maintainer repo only.
  release-please:
    if: github.repository_owner == 'recalcitrantsupplant'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # When a release is actually cut, run the full suite then deploy the demo.
  # (Chained here rather than on a tag trigger: tags pushed by GITHUB_TOKEN do
  # not start new workflow runs, so a standalone tag-triggered deploy wouldn't fire.)
  deploy-demo:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./scripts/ops/ci.sh
      - run: ./scripts/ops/deploy-demo.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
