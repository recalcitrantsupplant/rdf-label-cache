name: seed-labels

# Seed YOUR labels into your R2 bucket from a folder of RDF files (the file-based
# Phase-2 seed path). Unlike `seed.yml` (maintainer-only public-vocab refresh),
# this runs in ANY fork: add the Cloudflare secrets/variables below, drop RDF in
# labels/, then Actions tab → Run workflow. Manual only - never on push - so a
# fork's secrets are never exposed to an untrusted contribution.
# See "Get started fast" in README.md.
on:
  workflow_dispatch:
    inputs:
      labels_dir:
        description: Folder of RDF label files to ingest
        default: labels
        type: string
      include_public:
        description: Also seed common ontology labels (rdf, rdfs, owl, skos, dcterms, dcat, schema.org)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      # Fail fast with an exact checklist if any required variable/secret is
      # unset - GitHub can't ship pre-named placeholders, so a fresh fork starts
      # empty. Runs before checkout/install so a misconfigured repo fails in
      # seconds, not after setup. See "Get started fast" step 3 in README.md.
      - name: Preflight — required Actions variables & secrets
        env:
          SEED_BASE: ${{ vars.SEED_BASE }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          missing=()
          for v in SEED_BASE R2_BUCKET CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY PURGE_TOKEN; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required config: ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions:"
            echo "  Variables: SEED_BASE (your Worker URL), R2_BUCKET (the bucket name)"
            echo "  Secrets:   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, PURGE_TOKEN"
            echo "See 'Get started fast' step 3 in README.md."
            exit 1
          fi
          echo "All required variables and secrets are set."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ops/seed-labels.sh
        env:
          LABELS_DIR: ${{ inputs.labels_dir }}
          # workflow_dispatch booleans arrive as strings; map to the non-empty
          # flag scripts/ops/seed-labels.sh expects (and '' when unchecked).
          INCLUDE_PUBLIC: ${{ inputs.include_public && '1' || '' }}
          # Set these as repository Variables (Settings → Secrets and variables →
          # Actions → Variables). SEED_BASE is your deployed Worker URL.
          SEED_BASE: ${{ vars.SEED_BASE }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          # Set these as repository Secrets (same page → Secrets).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
