name: deploy-demo

# Redeploys the maintainer demo. Runs automatically on pushes to main that touch
# the static demo site (demo/public/**), on a cut release (release.yml), or
# manually. Maintainer repo only; needs Cloudflare secrets, which forks lack.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/public/**'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'recalcitrantsupplant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./scripts/ops/ci.sh
      - run: ./scripts/ops/deploy-demo.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
