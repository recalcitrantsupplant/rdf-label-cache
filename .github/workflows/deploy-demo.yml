name: deploy-demo

# Redeploys the maintainer demo. Runs automatically on pushes to main that touch
# demo sources, build scripts, or dependencies, on a cut release (release.yml), or
# manually. Maintainer repo only; needs Cloudflare secrets, which forks lack.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/public/**'
      - 'demo/wrangler.demo.toml'
      - 'packages/label-cache-client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ops/build-demo.sh'
      - 'scripts/ops/vendor-*'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'recalcitrantsupplant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./scripts/ops/ci.sh
      - run: ./scripts/ops/deploy-demo.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
