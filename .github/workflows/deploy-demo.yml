name: deploy-demo

# Manual redeploy of the maintainer demo (the automatic deploy happens in
# release.yml when a release is cut). Maintainer repo only; needs Cloudflare
# secrets, which forks don't have.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'recalcitrantsupplant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./scripts/ci.sh
      - run: ./scripts/deploy-demo.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
