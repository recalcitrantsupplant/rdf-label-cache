name: dependency-health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *' # Daily audit, around 06:17 Brisbane time.
    - cron: '43 20 * * 0' # Weekly override review, Monday in Brisbane.

permissions:
  contents: read

concurrency:
  group: dependency-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Audit the committed dependency tree; do not update it on a schedule.
      - name: Audit all dependencies
        run: pnpm audit
      - name: Check whether upstream has made overrides unnecessary
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '43 20 * * 0')
        run: python3 scripts/ops/check-security-overrides.py
