version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Supply-chain hardening: don't open update PRs until a release is 7 days old.
    cooldown:
      default-days: 7
    # Keep routine updates separate so a major cannot block their auto-merge.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [major]
      npm-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-security-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [major]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
